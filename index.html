<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VRM Editor</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
VRM Editor
</div>

<nav>

<button id="openVRM">Open VRM</button>

<button id="exportVRM">Export</button>

<button id="resetCamera">Reset Camera</button>

<input
type="file"
id="vrmFile"
accept=".vrm"
hidden>

</nav>

</header>

<div class="editor">

<!-- Scene -->

<aside class="left">

<h3>Scene</h3>

<div id="meshList">

No Model

</div>

</aside>

<!-- Viewport -->

<main class="viewport">

<canvas id="canvas"></canvas>

<div id="loading">

Load VRM

</div>

</main>

<!-- Inspector -->

<aside class="right">

<h3>Inspector</h3>

<div id="inspector">

Select a Mesh

</div>

</aside>

</div>

<script type="module" src="script.js"></script>

</body>

</
