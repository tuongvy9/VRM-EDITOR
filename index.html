<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VRM Editor</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<button id="menuBtn">☰</button>

<div class="title">
VRM Editor
</div>

<div class="actions">

<input
type="file"
id="vrmFile"
accept=".vrm"
hidden>

<button id="openVRM">
Open
</button>

<button id="exportVRM" disabled>
Export
</button>

</div>

</header>

<div class="viewer">

<canvas id="canvas"></canvas>

<div id="loading">
Drop VRM Here
</div>

</div>

<div class="tabs">

<button class="tab active">
Mesh
</button>

<button class="tab">
Texture
</button>

<button class="tab">
Material
</button>

<button class="tab">
BlendShape
</button>

<button class="tab">
Expression
</button>

</div>

<div class="panel">

<div id="panelContent">

Open a VRM Model

</div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
